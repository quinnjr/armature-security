[package]
name = "armature-security"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-security"
homepage = "https://quinnjr.github.io/armature"
description = "Security utilities and middleware for Armature"
keywords = ["security", "csrf", "cors", "xss"]
categories = ["web-programming", "authentication"]

[dependencies]
armature-core = { version = "0.8" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
sha2 = "0.11"
hex = "0.4"
thiserror = "2.0"
hmac = "0.13.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }
bytes = "1.12"

